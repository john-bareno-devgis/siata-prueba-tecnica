networks:
  # internal: solo los servicios que necesitan hablar con la BD y entre sí.
  internal:
  # public: servicios alcanzables desde web (reverse proxy). No se exponen puertos
  # de host aquí salvo en 'web', que es el único punto de entrada externo.
  public:

volumes:
  pgdata:

services:
  db:
    build:
      context: ./db
    # postgis/postgis no publica build arm64 en ningún tag (verificado en el
    # manifest de Docker Hub). Se fija amd64 explícito: en Mac Apple Silicon o
    # Windows ARM, Docker Desktop lo ejecuta vía emulación (Rosetta/QEMU) sin
    # configuración extra, a costa de algo de rendimiento.
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sin 'ports': la BD solo debe ser alcanzable desde la red interna
    # (loader, backend), nunca directamente desde el host.

  loader:
    build: ./loader
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SCHEMA: ${DB_SCHEMA}
      DB_TABLE: ${DB_TABLE}
    volumes:
      - ./data:/data:ro
    networks:
      - internal

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      loader:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SCHEMA: ${DB_SCHEMA}
      DB_TABLE: ${DB_TABLE}
    networks:
      - internal
      - public
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Sin 'ports': solo 'web' (Nginx) lo expone al host, vía reverse proxy.
