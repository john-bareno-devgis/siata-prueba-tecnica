# GeoTools (motor de CRS de GeoServer) no trae EPSG:9377 precargado en su
# base EPSG embebida (es un codigo relativamente reciente), igual que le
# pasaba a PostGIS con spatial_ref_sys (ver db/init/01_schema.sql). Este
# archivo, colocado en <data_dir>/user_projections/epsg.properties, es el
# mecanismo oficial de GeoTools/GeoServer para agregar codigos EPSG
# faltantes.
#
# IMPORTANTE - orden de ejes: la definicion oficial EPSG:9377 declara eje
# 1 = Northing, eje 2 = Easting (verificado con `projinfo EPSG:9377`).
# GeoTools respeta ese orden al pie de la letra al reproyectar; PostGIS/
# GDAL, en cambio, siempre leen/escriben coordenadas como (X=easting,
# Y=northing), ignorando esa metadata. Con AXIS en orden oficial
# (Northing,Easting), GeoServer interpretaba las coordenadas de PostGIS
# invertidas y el mapa aparecia desplazado a otro continente. Se declara
# aqui en orden (Easting,Northing) para que coincida con como PostGIS
# realmente sirve los datos.
9377=PROJCS["MAGNA-SIRGAS 2018 / Origen-Nacional",GEOGCS["MAGNA-SIRGAS 2018",DATUM["Marco_Geocentrico_Nacional_de_Referencia_2018",SPHEROID["GRS 1980",6378137,298.257222101,AUTHORITY["EPSG","7019"]],AUTHORITY["EPSG","1329"]],PRIMEM["Greenwich",0,AUTHORITY["EPSG","8901"]],UNIT["degree",0.0174532925199433,AUTHORITY["EPSG","9122"]],AUTHORITY["EPSG","20046"]],PROJECTION["Transverse_Mercator"],PARAMETER["latitude_of_origin",4],PARAMETER["central_meridian",-73],PARAMETER["scale_factor",0.9992],PARAMETER["false_easting",5000000],PARAMETER["false_northing",2000000],UNIT["metre",1,AUTHORITY["EPSG","9001"]],AXIS["Easting",EAST],AXIS["Northing",NORTH],AUTHORITY["EPSG","9377"]]
