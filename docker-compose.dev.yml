# Override de DESARROLLO, no se carga automáticamente (docker compose solo
# auto-carga 'docker-compose.override.yml'; este archivo necesita -f
# explícito, ver README "Modo desarrollo"). Monta el código fuente como
# bind mount para ver cambios sin reconstruir la imagen.
services:
  backend:
    volumes:
      - ./backend/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  web:
    volumes:
      - ./web/site:/usr/share/nginx/html
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf
